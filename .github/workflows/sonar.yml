
name: SonarCloud - Componente C4

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: Analisis de calidad C4
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Ejecutar pruebas y generar cobertura C4
        run: npm run test:coverage

      - name: Comprobar informe LCOV
        shell: bash
        run: test -s coverage/lcov.info

      - name: Limitar analisis al componente C4
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          permitidos = {
              "client/src/PublishFindingPage.jsx",
              "client/src/SearchFindingsPage.jsx",
              "client/src/api/hallazgos.js",
              "client/src/api/misHallazgos.js",
              "client/src/PublishFindingPage.test.jsx",
              "client/src/SearchFindingsPage.test.jsx",
              "client/src/api/hallazgos.test.jsx",
          }

          archivos = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")
          excluidos = [
              archivo for archivo in archivos
              if archivo and archivo not in permitidos
          ]

          with Path("sonar-project.properties").open(
              "a", encoding="utf-8"
          ) as f:
              f.write("\nsonar.exclusions=" + ",".join(excluidos) + "\n")

          print(f"Archivos C4 permitidos: {len(permitidos)}")
          print(f"Archivos excluidos: {len(excluidos)}")
          PY

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
