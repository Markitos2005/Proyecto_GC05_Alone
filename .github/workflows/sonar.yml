
name: SonarCloud - Componente C4

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: Analisis de calidad C4
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Limitar analisis al componente C4
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          permitidos = {
              "client/src/PublishFindingPage.jsx",
              "client/src/SearchFindingsPage.js",
              "client/src/api/hallazgos.js",
              "client/src/api/misHallazgos.js",
              "client/src/PublishFindingPage.test.jsx",
              "client/src/SearchFindingsPage.test.jsx",
              "client/src/api/hallazgos.test.jsx",
          }

          archivos = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          excluidos = [
              archivo for archivo in archivos
              if archivo and archivo not in permitidos
          ]

          with Path("sonar-project.properties").open(
              "a", encoding="utf-8"
          ) as f:
              f.write("\nsonar.exclusions=" +
                      ",".join(excluidos) + "\n")

          print(f"Archivos excluidos: {len(excluidos)}")
          PY

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
