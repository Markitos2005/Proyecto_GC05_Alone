services:
  # Buzón de pruebas: captura mensajes localmente, sin enviarlos a Internet.
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gps
      POSTGRES_PASSWORD: gps_local
      POSTGRES_DB: lost_found
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init-test.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gps -d lost_found"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
